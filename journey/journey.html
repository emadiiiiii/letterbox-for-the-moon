<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Our Story 🌅</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn&display=swap');
    html, body {
      font-family: "Vazirmatn", Tahoma, sans-serif;
      margin: 0;
      padding: 0;
      background-color: black;
      overflow-x: hidden;
    }
    section {
      font-family: "Vazirmatn", Tahoma, sans-serif;
      height: 100vh;
      position: relative;
      background-size: auto 100%;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed; /* Parallax effect */
    }
    section::before,
    section::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 20%;
      z-index: 1;
      pointer-events: none;
    }

.glass {
  backdrop-filter: blur(1px);
  background: rgba(255,255,255,0.6);
}
@media (prefers-reduced-motion: reduce) {
  section {
    background-attachment: scroll;
  }
}
  </style>
</head>
<body class="font-sans text-white overflow-x-hidden" dir="rtl">

    <div id="timeline"></div>


  <script>
    const timeline = document.getElementById("timeline");

    const sections = [
      { image: "assets/1.jpg", text: "همه چیز از اینجا شروع شد" },
      { image: "assets/2.jpg", text: "دیت دوم رفتیم وینگ استاپ عین روانیا" },
      { image: "assets/3.jpg", text: "متوجه شدیم هردومون دوست داریم غذا بخوریم" },
      { image: "assets/4.jpg", text: "پس خذا غوردیم" },
      { image: "assets/5.jpg", text: "مخاذ دورغیذ" },
      { image: "assets/6.jpg", text: "سیباذ دویلبییذ" },
      { image: "assets/7.jpg", text: "سخذث لیاعبود" },
      { image: "assets/8.jpg", text: "غذا درست کردیم" },
      { image: "assets/9.jpg", text: "و بازم خوردیم" },
      { image: "assets/10.jpg", text: "هی درست کردیم" },
      { image: "assets/11.jpg", text: "هی خوردیم" },
      { image: "assets/12.jpg", text: "خیلی خوردیم" },
      { image: "assets/13.jpg", text: "فکر می‌کنی سیر شدیم؟" },
      { image: "assets/14.jpg", text: "نه، ما بازم خوردیم" },
      { image: "assets/13.jpg", text: "." },
      { image: "assets/13.jpg", text: "." },

    ];

    sections.forEach(({ image, date, text }) => {
      const section = document.createElement("section");
      section.style.backgroundImage = `url('${image}')`;
      section.innerHTML = `
  <div class="absolute inset-0 flex items-end justify-center px-6 pb-12">
    <div class="glass max-w-xl p-3 rounded-xl text-center shadow-xl">
      <p class="text-md font-bold text-black">${text}</p>
    </div>
  </div>`;

      timeline.appendChild(section);
    });
  </script>
</body>
</html>
