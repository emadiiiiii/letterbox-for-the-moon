    html, body {

    .spinner {
  border-top-color: #ec4899; /* pink */

  height: 64px;
  border-width: 4px;
  animation: spin 1s linear infinite;

  font-family: "Vazirmatn";

@keyframes spin {
  to { transform: rotate(360deg); }
}

    .glass {

    /* Floating hearts animation */
    .heart {
      position: fixed;
      bottom: -20px;
      font-size: 20px;
      animation: floatUp 6s linear infinite;
      opacity: 0.8;
      z-index: 50;

    @keyframes floatUp {
      0% { transform: translateY(0) scale(1); opacity: 0.8; }
      50% { opacity: 1; }
      100% { transform: translateY(-120vh) scale(1.5); opacity: 0; }
    }

    .chick {
  position: fixed;

}

  @keyframes wiggle {

    const chick = document.createElement("img");
    chick.classList.add("chick");
    chick.src = "assets/chick_still.png"; // default still chick
    document.body.appendChild(chick);
  
    let chickX = -100; // start off-screen
    let direction = 1;
    const beakHearts = [];
    let stepFrame = 0; // frame counter
    let legToggle = true; // alternate between left/right
  
    function moveChick() {
      const screenWidth = window.innerWidth;
      chickX += direction * 5;
  
      chick.style.left = chickX + "px";
      chick.style.transform = direction === 1 ? "scaleX(1)" : "scaleX(-1)";
  
      // Skip animation: alternate left/right no matter the direction
      stepFrame++;
      if (stepFrame % 1 === 0) { // adjust "skip" speed
        if (chick.src.includes("still")) {
          chick.src = legToggle ? "assets/chick_left.png" : "assets/chick_right.png";
          legToggle = !legToggle;
        } else {
          chick.src = "assets/chick_still.png";
        }
      }
  
      // Reset when off screen
      if (chickX > screenWidth + 100 || chickX < -100) {
        beakHearts.forEach(h => h.remove());
        beakHearts.length = 0;
        direction *= -1; // flip direction
      }
  
      // Catch falling hearts
      document.querySelectorAll(".heart").forEach((heart) => {
        const rect = heart.getBoundingClientRect();
        const chickRect = chick.getBoundingClientRect();
  
        if (
          rect.bottom > chickRect.top &&
          rect.left < chickRect.right &&
          rect.right > chickRect.left &&
          rect.top < chickRect.bottom
        ) {
          // Attach heart to chick's beak
          // Attach heart to chick's beak
heart.remove();
const beakHeart = document.createElement("div");
beakHeart.classList.add("beak-heart");
beakHeart.textContent = "❤️";
document.body.appendChild(beakHeart); // append directly to body, not inside chick
beakHeart.style.left = chickX + 30 + "px";
beakHeart.style.bottom = "60px";
beakHearts.push(beakHeart);

        }
      });
  
      // Move beak hearts with chick
      beakHearts.forEach((h, i) => {
        h.style.left = chickX + 35 + (i * 10) + "px";
      });
    }
  
    setInterval(moveChick, 100);
// Chick click handler
chick.addEventListener("click", () => {
  beakHearts.forEach((h) => {
    const startX = parseFloat(h.style.left);
    const startBottom = parseFloat(h.style.bottom);

    // Random positions for scattering in the air
    const scatterX = startX + (Math.random() * 200 - 100);
    const scatterY = startBottom + (Math.random() * 100 + 50); // rise higher

    // Random rotation
    const rotateDeg = Math.random() * 360;

    // First, scatter around in the air
    h.style.transition = "all 0.6s ease-out";
    h.style.left = scatterX + "px";
    h.style.bottom = scatterY + "px";
    h.style.transform = `rotate(${rotateDeg}deg)`;

    // After scattering, fall down off-screen
    setTimeout(() => {
      const fallX = scatterX + (Math.random() * 200 - 100); // final horizontal drift
      h.style.transition = "all 1.5s ease-in";
      h.style.left = fallX + "px";
      h.style.bottom = -100 + "px"; // fall below screen
      h.style.transform = `rotate(${rotateDeg + 360}deg)`; // continue spinning
    }, 600);
  });

  // Remove hearts after animation
  setTimeout(() => {
    beakHearts.forEach(h => h.remove());
    beakHearts.length = 0;
  }, 2200);
});



  </script>

    entries.forEach(entry => {
      if (entry.isIntersecting) {

  function launchConfetti() {
  const duration = 5 * 1000; // 5 seconds
  const end = Date.now() + duration;

  (function frame() {
    confetti({
      particleCount: 4,
      angle: 60,
      spread: 55,
      origin: { x: 0 }
    });
    confetti({
      particleCount: 4,
      angle: 120,
      spread: 55,
      origin: { x: 1 }
    });

    if (Date.now() < end) {
      requestAnimationFrame(frame);
    }
  })();
}


function typeText(element, text, speed = 30) {
    let i = 0;
    element.textContent = "";
    const interval = setInterval(() => {
        element.textContent += text.charAt(i);
        i++;
        if (i >= text.length) clearInterval(interval);
    }, speed);
}

// Observe sections and trigger typing when visible
const typingObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
        if (entry.isIntersecting && entry.target.querySelector('.typing-text')) {
            const p = entry.target.querySelector('.typing-text');
            const fullText = p.dataset.fullText;
            if (!p.classList.contains('typed')) { // prevent re-typing
                typeText(p, fullText, 40);
                p.classList.add('typed');
            }
        }
    });
}, { threshold: 0.5 });

document.querySelectorAll('section').forEach(section => typingObserver.observe(section));

const musicBtn = document.getElementById("music-btn");
let isPlaying = false;

// Function to play music from start
function startMusic() {
  bgMusic.currentTime = 0; // start from the beginning
  bgMusic.play().then(() => {
    isPlaying = true;
    musicBtn.textContent = "⏸️"; // update button
  }).catch(err => console.log("Playback blocked:", err));
}

// Start music on first user interaction
function unlockMusic() {
  startMusic();
  document.removeEventListener("click", unlockMusic);
  document.removeEventListener("touchstart", unlockMusic);
  document.removeEventListener("scroll", unlockMusic);
}

document.addEventListener("click", unlockMusic);
document.addEventListener("touchstart", unlockMusic);
document.addEventListener("scroll", unlockMusic);

// Toggle button
musicBtn.addEventListener("click", () => {
  if (isPlaying) {
    bgMusic.pause();
    musicBtn.textContent = "🎶";
  } else {
    bgMusic.currentTime = 0; // optional: always restart on play
    bgMusic.play();
    musicBtn.textContent = "⏸️";
  }
  isPlaying = !isPlaying;
});
