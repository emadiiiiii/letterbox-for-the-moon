<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Our Story 🌅</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: black;
      overflow-x: hidden;
    }
    section {
      height: 100vh;
      position: relative;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed; /* Parallax effect */
    }
    section::before,
    section::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 20%;
      z-index: 1;
      pointer-events: none;
    }

    section::before {
      left: 0;
      background: linear-gradient(to right, black, transparent);
    }

    section::after {
      right: 0;
      background: linear-gradient(to left, black, transparent);
    }

    section::before,
section::after,
section::backdrop-top,
section::backdrop-bottom {
  content: "";
  position: absolute;
  z-index: 1;
  pointer-events: none;
}

section::before {
  left: 0;
  top: 0;
  bottom: 0;
  width: 20%;
  background: linear-gradient(to right, black, transparent);
}

section::after {
  right: 0;
  top: 0;
  bottom: 0;
  width: 20%;
  background: linear-gradient(to left, black, transparent);
}

section::backdrop-top {
  top: 0;
  left: 0;
  right: 0;
  height: 20%;
  background: linear-gradient(to bottom, black, transparent);
}

section::backdrop-bottom {
  bottom: 0;
  left: 0;
  right: 0;
  height: 20%;
  background: linear-gradient(to top, black, transparent);
}

.fade-top, .fade-bottom {
  position: absolute;
  left: 0;
  right: 0;
  height: 20%;
  z-index: 1;
  pointer-events: none;
}

.fade-top {
  top: 0;
  background: linear-gradient(to bottom, black, transparent);
}

.fade-bottom {
  bottom: 0;
  background: linear-gradient(to top, black, transparent);
}


    .glass {
      backdrop-filter: blur(10px);
      background: rgba(255,255,255,0.65);
    }
    @media (prefers-reduced-motion: reduce) {
      section {
        background-attachment: scroll;
      }
    }
  </style>
</head>
<body class="font-sans text-white">

  <div id="timeline"></div>

  <script>
    const timeline = document.getElementById("timeline");

    const sections = [
      { image: "assets/1.jpg", date: "Aug 22, 2024", text: "The day we met — two coffees, one long walk, and a feeling we couldn’t shake." },
      { image: "assets/2.jpg", date: "Sep 10, 2024", text: "First date — laughter over lattes, and the world outside got quiet." },
      { image: "assets/1.jpg", date: "Oct 5, 2024", text: "Sunset at the lake — our hearts spoke without words." },
      { image: "assets/2.jpg", date: "Dec 2, 2024", text: "First trip — wrong turns, right person." },
      { image: "assets/1.jpg", date: "Jan 18, 2025", text: "A promise — to keep showing up for each other every day." },
      { image: "assets/2.jpg", date: "Jan 18, 2025", text: "A promise — to keep showing up for each other every day." },
      { image: "assets/1.jpg", date: "Jan 18, 2025", text: "A promise — to keep showing up for each other every day." },

    ];

    sections.forEach(({ image, date, text }) => {
      const section = document.createElement("section");
      section.style.backgroundImage = `url('${image}')`;
      section.innerHTML = `
      <div class="fade-top"></div>
  <div class="fade-bottom"></div>
  <div class="absolute inset-0 flex items-center justify-center px-6">
    <div class="glass max-w-xl p-6 rounded-xl text-center shadow-xl">
      <h2 class="text-2xl font-semibold mb-2 text-black">Date</h2>
      <p class="text-lg text-black">Text</p>
    </div>
  </div>`;
      timeline.appendChild(section);
    });
  </script>
</body>
</html>
