<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="media/chick_right.png" />

  <meta name="viewport" content="width=device-width, height=device-height,  initial-scale=1.0" />
  <title>جوجه ی من ^^</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn&display=swap');
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: "Vazirmatn", Tahoma, sans-serif;
      background: #cceeff;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
    }

    #hud {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0.5rem;
  font-size: 1.5rem;
  background: rgba(255, 255, 255, 0.7);
  position: absolute;
  top: 0;
  left: 0;
  z-index: 10;
  box-sizing: border-box;
}


    #game-area {
      position: relative;
      flex: 1;
      width: 100%;
      background: #88cc88;
      overflow: hidden;
    }

    #chick {
      position: absolute;
      bottom: 0;
      width: 64px;
      height: auto;
      transition: transform 0.1s;
    }

    .heart {
      position: absolute;
      width: 32px;
      height: auto;
      pointer-events: none;
    }

    .controls {
      display: none;
      justify-content: center;
      gap: 2rem;
      padding: 1rem;
      flex-wrap: wrap;
      flex-direction: row;
    }

    button {
      padding: 1rem 2rem;
      font-size: 1.2rem;
      border-radius: 10px;
      font-family: "Vazirmatn", Tahoma, sans-serif;
      border: none;
      background: #ffcc00;
      color: #000;
      box-shadow: 0 4px #cc9900;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:active {
      transform: translateY(2px);
      box-shadow: 0 2px #cc9900;
    }

    #heart-counter {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

#heart-counter img {
  width: 20px;

}

.controls button {
  background: none;
  border: none;
  padding: 0;
  cursor: pointer;
  box-shadow: none;
  border-radius: 0;
  width: 64px;
  height: 64px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.controls button img {
  width: 100%;
  height: auto;
  pointer-events: none; /* تا فقط خود دکمه کلیک بشه نه تصویر داخلش */
}

.controls button:active {
  transform: scale(0.95);
}

.flipped {
  transform: scaleX(-1);
}



    #play-button {
      font-size: 1.5rem;
      margin: 1rem;
    }

    @media (max-width: 600px) {
      button {
        padding: 0.8rem 1.5rem;
        font-size: 1rem;
      }

      #hud {
        font-size: 1rem;
      }
      #overlay {
      position: absolute;
      z-index: 999;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.95);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 1.5rem;
      text-align: center;
    }

#overlay h1 {
  margin-bottom: 1rem;
}



@media (max-width: 600px) {
  #overlay {
    font-size: 1.1rem;
    padding: 1rem;
  }
}
#game-over-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(255, 255, 255, 0.9);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  flex-direction: column;
  font-size: 1.5rem;
  text-align: center;
  opacity: 0;
  transition: opacity 0.8s ease;
  pointer-events: none;
}
#game-over-overlay.visible {
  opacity: 1;
  pointer-events: all;
}
.game-over-box {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1rem;
}

.broken-heart {
  width: 100px;
  height: auto;
}

    }
  </style>
</head>
<div id="game-over-overlay" style="display: none;">
  <div class="game-over-box">
    <img src="media/broken_heart.png" alt="Broken Heart" class="broken-heart" />
    <p>قلبمو شکستی :(((</p>
    <button id="retry-button">یه فرصت دیگه</button>
  </div>
</div>

<body>
  <div id="overlay" dir="rtl">
    <img src="media/chick_right.png" alt="جوجه" width="100rem">
    <h1>شلام جوجه‌ی من :)) </h1>
    <p>روی "باجی کنم" کلیک کن تا شروع کنیم!</p>
    <button id="play-button" >باجی کنم</button>
  </div>

  <div id="hud">
    <div id="heart-counter" class="align-items">
      
      <img src="media/heart.png" alt="گلب"  > 
      <span >
      0</span>
    </div>
    <button id="pause-button">خسته جدم</button>
  </div>

  <div id="game-area">
    <img id="chick" src="media/chick_still.png" alt="Chick" />
  </div>


  <div class="controls">
  <button id="left"><img src="media/arrow_left.png" alt="left" /></button>
  <button id="right"><img src="media/arrow_left.png" class="flipped" alt="right" /></button>
</div>


  <audio id="bg-music" src="media/jooje.mp3" loop></audio>
  <audio id="eat-sound" src="media/eat.wav"></audio>
<audio id="heartbreak-sound" src="media/heartbreak.wav"></audio>


  <script>
    const gameOverOverlay = document.getElementById('game-over-overlay');
    const retryButton = document.getElementById('retry-button');
    const chick = document.getElementById('chick');
    const leftBtn = document.getElementById('left');
    const rightBtn = document.getElementById('right');
    const controls = document.querySelector('.controls');
    const playButton = document.getElementById('play-button');
    const pauseButton = document.getElementById('pause-button');
    const bgMusic = document.getElementById('bg-music');
    const gameArea = document.getElementById('game-area');
    const heartCounter = document.getElementById('heart-counter');
    const eatSound = document.getElementById('eat-sound');
    const heartbreakSound = document.getElementById('heartbreak-sound');

    let heartFallSpeed = 2; 
    let position = 100;
    let walkTimer = null;
    let walkToggle = false;
    let direction = 'still';
    let heartInterval = null;
    const maxHearts = 3;
    let gamePaused = false;
    let heartCount = 0;

    const endGame = () => {
      gamePaused = true;
      fadeAudio(0, () => bgMusic.pause());
      gameOverOverlay.style.display = 'flex';
      gameOverOverlay.classList.add('visible');
    };


    const updateChickImage = (dir) => {
      if (dir === 'left') {
        chick.src = `media/${walkToggle ? 'chick_left' : 'chick_still'}.png`;
      } else if (dir === 'right') {
        chick.src = `media/${walkToggle ? 'chick_right' : 'chick_still'}.png`;
      } else {
        chick.src = 'media/chick_still.png';
      }
      walkToggle = !walkToggle;
    };

    const move = (dir) => {
      direction = dir;
      if (!walkTimer) {
        walkTimer = setInterval(() => {
          if (dir === 'left') {
            position = Math.max(0, position - 25);
          } else if (dir === 'right') {
            position = Math.min(window.innerWidth - 64, position + 25);
          }
          chick.style.left = position + 'px';
          updateChickImage(dir);
        }, 100);
      }
    };

    const stop = () => {
      clearInterval(walkTimer);
      walkTimer = null;
      direction = 'still';
      updateChickImage('still');
    };

    const fadeAudio = (targetVolume, callback) => {
      const step = 0.05;
      const interval = 75;
      const fade = setInterval(() => {
        const currentVolume = bgMusic.volume;
        if ((targetVolume < currentVolume && currentVolume <= step) ||
            (targetVolume > currentVolume && currentVolume >= 1 - step)) {
          bgMusic.volume = targetVolume;
          clearInterval(fade);
          if (callback) callback();
        } else {
          bgMusic.volume += (targetVolume - currentVolume) * step;
        }
      }, interval);
    };

    const enableControls = () => {
      position = (window.innerWidth - 64) / 2;
      chick.style.left = position + 'px';

      document.getElementById('overlay').style.display = 'none';
      controls.style.display = 'flex';
      playButton.style.display = 'none';
      bgMusic.volume = 0;
      bgMusic.play();
      fadeAudio(1);
      heartInterval = setInterval(spawnHeart, 2500);
      requestAnimationFrame(updateGame);
    };

    const spawnHeart = () => {
      if (gamePaused) return;
      const currentHearts = document.querySelectorAll('.heart');
      if (currentHearts.length >= maxHearts) return;

      const heart = document.createElement('img');
      heart.src = 'media/heart.png';
      heart.classList.add('heart');
      heart.style.left = Math.random() * (window.innerWidth - 32) + 'px';
      heart.style.top = '0px';
      gameArea.appendChild(heart);
    };

    const updateGame = () => {
      if (!gamePaused) {
        const hearts = document.querySelectorAll('.heart');
        hearts.forEach((heart) => {
          const top = parseFloat(heart.style.top);
          if (top >= window.innerHeight - 64) {
            heart.remove();
            heartbreakSound.currentTime = 0;
            heartbreakSound.play();
            endGame();
          } else {
            heart.style.top = top + heartFallSpeed  + 'px';
          }
        });
        
        checkHeartCollision();
      }
      requestAnimationFrame(updateGame);
    };

    const checkHeartCollision = () => {
      const chickRect = chick.getBoundingClientRect();
      const hearts = document.querySelectorAll('.heart');
      hearts.forEach((heart) => {
        const heartRect = heart.getBoundingClientRect();
        if (
          chickRect.left < heartRect.right &&
          chickRect.right > heartRect.left &&
          chickRect.bottom > heartRect.top &&
          chickRect.top < heartRect.bottom
        ) {
          heart.remove();
          eatSound.currentTime = 0;
          eatSound.play();
          heartCount++;
          heartCounter.innerHTML = `<img src="media/heart.png" alt="گلب" width="20px"> ${heartCount}`;
          heartFallSpeed = 2 + (heartCount % 5 === 0 ? 0.2 : 0); 
          
        }
      });
    };

    const togglePause = () => {
      gamePaused = !gamePaused;
      if (gamePaused) {
        pauseButton.textContent = 'باجی کنم';
        fadeAudio(0, () => bgMusic.pause());
      } else {
        pauseButton.textContent = 'خسته جدم';
        bgMusic.play();
        fadeAudio(1);
      }
    };  

    retryButton.addEventListener('click', () => {
      document.querySelectorAll('.heart').forEach((heart) => heart.remove());
      position = (window.innerWidth - 64) / 2;
      chick.style.left = position + 'px';
      updateChickImage('still');
      heartCount = 0;
      heartCounter.innerHTML = `<img src="media/heart.png" width="20px"> ${heartCount}`;
      gameOverOverlay.classList.remove('visible');
      gameOverOverlay.style.display = 'none';
      bgMusic.currentTime = 0;
      bgMusic.play();
      fadeAudio(1);
      gamePaused = false;
    });


    pauseButton.addEventListener('click', togglePause);
    playButton.addEventListener('click', enableControls);

    leftBtn.addEventListener('touchstart', (e) => { e.preventDefault(); move('left'); });
    rightBtn.addEventListener('touchstart', (e) => { e.preventDefault(); move('right'); });

    leftBtn.addEventListener('mousedown', () => move('left'));
    rightBtn.addEventListener('mousedown', () => move('right'));


    leftBtn.addEventListener('mouseup', stop);
    rightBtn.addEventListener('mouseup', stop);

    leftBtn.addEventListener('touchend', stop);
    rightBtn.addEventListener('touchend', stop);

    document.addEventListener('touchend', stop);
    document.addEventListener('mouseup', stop);

    chick.style.left = position + 'px';
  </script>
</body>
</html>
