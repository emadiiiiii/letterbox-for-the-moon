<!DOCTYPE html>
<html lang="en" >
<head>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#ffcc00" />
  <link rel="apple-touch-icon" href="media/icon-192.png" />
  <meta charset="UTF-8">
  <title>نامه‌ها</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn&display=swap');

    body {
      font-family: "Vazirmatn", Tahoma, sans-serif;
      background: linear-gradient(to bottom right, #ffecd2, #fcb69f);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      direction: ltr;
      perspective: 1000px;
    }

    .letters {
      display: flex;
      gap: 40px;
    }

    .letter-container {
      text-align: center;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .letter {
      width: 160px;
      height: 110px;
      background: #fff;
      border: 2px solid #dcdcdc;
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      transform-style: preserve-3d;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    .letter::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 50%;
      background: #ff6f61;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      transform-origin: top center;
      transform: rotateX(0deg);
      transition: transform 0.5s ease;
      z-index: 2;
    }

    .letter::after {
      content: '';
      position: absolute;
      bottom: 50%;
      left: 0;
      width: 100%;
      height: 50%;
      background: #ffefef;
      clip-path: polygon(0% 0%, 50% 100%, 100% 0%, 100% 100%, 0 100%);
      z-index: 1;
    }

    .letter-content {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, 100%);
      width: 80%;
      height: 80%;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: transform 0.5s ease;
      z-index: 1;
    }

    .letter-container:hover .letter-content {
      transform: translate(-50%, -50%);
    }

    .letter:hover::before {
      transform: rotateX(-160deg);
    }

    .label {
      margin-top: 16px;
      font-weight: bold;
      font-size: 18px;
      color: #333;
    }

    .letter-container:hover {
      transform: translateY(-8px);
    }

    .letter-container:hover .letter {
      box-shadow: 0 12px 25px rgba(0, 0, 0, 0.25);
    }

    .letter-content-line {
        width: 80%;
        height: 4px;
        background-color: #333;
        margin: 8px auto;
        border-radius: 2px;
    }

    .bottom-flap {
  position: absolute;
  bottom: 0%;
  left: 0;
  width: 100%;
  height: 50%;
  background: #ffefef;
  clip-path: polygon(0 100, 100% 100%, 100% 0);
  z-index: 2;
}


  </style>
</head>
<body>

  <div class="letters flex">
    
    <div class="letter-container" onclick="navigateTo('ValentinesDay.html')">
      <div class="letter">
        <div class="letter-content">
            <div class="letter-content-line"></div>
            <div class="letter-content-line"></div>
            <div class="letter-content-line"></div>
        </div>
        <div class="bottom-flap"></div>
      </div>
      <div class="label">My Sunshine ❤</div>
    </div>
    <div class="letter-container" onclick="navigateTo('jooje.html')">
      <div class="letter">
        <div class="letter-content">
            <div class="letter-content-line"></div>
            <div class="letter-content-line"></div>
            <div class="letter-content-line"></div>
        </div>
        <div class="bottom-flap"></div>
      </div>
      <div class="label">jooje 🐤</div>
    </div>

      <div class="letter">
        <div class="letter-content">
            <div class="letter-content-line"></div>
            <div class="letter-content-line"></div>
            <div class="letter-content-line"></div>
        </div>
        <div class="bottom-flap"></div>
      </div>
      <div class="label">Test 2</div>
    </div> -->
  </div>

  <script>
    function navigateTo(page) {
      window.location.href = page;
    }
  </script>

  <script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js");
  }
</script>

</body>
</html>
